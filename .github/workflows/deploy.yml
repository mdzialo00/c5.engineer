name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn opennextjs-cloudflare build
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$DEPLOYMENT_URL" -o page.html
          status=0
          for expected in 'name="robots" content="noindex' 'https://github.com/mdzialo00' 'https://www.linkedin.com/in/mdzialo/'; do
            if ! grep -qF "$expected" page.html; then
              echo "::error::Smoke test: page HTML is missing $expected"
              status=1
            fi
          done
          exit $status
